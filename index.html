<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Destek — Malatya RP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0b0d10;color:#e4e6eb;min-height:100vh;display:flex;align-items:center;justify-content:center}
        .lock{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;max-width:420px;width:90%}
        .lock svg{width:64px;height:64px;color:rgba(255,52,0,0.4);margin-bottom:20px}
        .lock h1{font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:700;color:#fff;margin-bottom:8px}
        .lock p{font-size:0.85rem;color:rgba(255,255,255,0.3);line-height:1.6}
        .lock .dot{width:8px;height:8px;border-radius:50%;background:#ff3d00;margin-top:24px;animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
        .lock .brand{font-family:'Space Grotesk',sans-serif;font-size:0.7rem;color:rgba(255,255,255,0.12);margin-top:32px;letter-spacing:0.05em;text-transform:uppercase}
    </style>
</head>
<body>
    <div class="lock">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <h1>Site Kilitli</h1>
        <p>Destek sistemi şu anda kapalıdır. Yetkililer tarafından tekrar açıldığında hizmete devam edecektir.</p>
        <div class="dot"></div>
        <div class="brand">Malatya RP Canlı Destek</div>
    </div>
</body>
</html>
